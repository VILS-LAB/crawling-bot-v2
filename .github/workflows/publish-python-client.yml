name: Publish Python client to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build "twine>=7" pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test the wheel from a clean install
        # Run outside the source tree, otherwise `import crawlingbot` picks up
        # examples/python/crawlingbot/ instead of the installed wheel.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -I -c "import crawlingbot, sys; print(crawlingbot.__file__, crawlingbot.__version__); assert 'site-packages' in crawlingbot.__file__"

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="python-v$(python -c 'import crawlingbot; print(crawlingbot.__version__)')"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag '$tag' does not match package version '$expected'"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: examples/python/dist/

  publish-testpypi:
    name: Upload to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/crawlingbot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Upload to PyPI
    needs: build
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'python-v'))
      || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crawlingbot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
